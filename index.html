    <title>Sandeep Kumar Bodapudi | Software for your business</title>
    <meta name="description" content="Freelance software developer in Hyderabad. I build CRMs, billing, stock and customer portals for Indian businesses." />
    <meta name="theme-color" content="#F3EFE6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0B0A" media="(prefers-color-scheme: dark)" />
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
